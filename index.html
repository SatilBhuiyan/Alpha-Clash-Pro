<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha Clash Pro</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="font-poppins">
    <main
      class="min-h-screen bg-[#1E1E1E] bg-[url(images/background.png)] bg-no-repeat bg-center"
    >
      <!-- home screen -->
      <section
        class="home min-h-screen text-white flex flex-col justify-center items-center hidden"
      >
        <div class="text-center">
          <h1 class="text-8xl font-anton">ALPHABET CLASH</h1>
          <p class="my-8">
            Unleash Your Keyboard Kung Fu : Press “Enter” to Play
          </p>
          <button
            class="w-44 h-16 bg-white text-black font-semibold text-2xl rounded-sm"
          >
            Play Now
          </button>
        </div>
      </section>
      <!-- play ground -->
      <section class="play-ground">
        <div class="flex flex-col items-center gap-20 pt-10">
          <!-- screen -->
          <div
              class="w-[1170px] h-[400px] border-[20px] border-[#010313CC] rounded-2xl bg-[#FFFFFFB3]"
            >
              <div class="flex justify-center">
                <p class="bg-[#2F2941] px-6 pb-3 rounded-b-xl text-white">
                  Don't watch keyboard while playing...
                </p>
              </div>
              <div class="h-full flex justify-center items-center">
                <p class="text-black text-9xl font-bold">Y</p>
              </div>
          </div>
          <!-- keyboard -->
          <div class="w-[685px] h-[185px]">
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd class="kbd w-[60px] h-[60px] text-xl">q</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">w</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">e</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">r</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">t</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">y</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">u</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">i</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">o</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">p</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd class="kbd w-[60px] h-[60px] text-xl">a</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">s</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">d</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">f</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">g</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">h</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">j</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">k</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">l</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd class="kbd w-[60px] h-[60px] text-xl">z</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">x</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">c</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">v</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">b</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">n</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">m</kbd>
              <kbd class="kbd w-[60px] h-[60px] text-xl">/</kbd>
            </div>
          </div>
          <!-- life score -->
          <div class="flex justify-between w-[1170px]">
            <button
              class="btn bg-[#894189] text-white border-none rounded-full"
            >
              Life
              <img src="images/Group 23.svg" alt="" />
              <span>1</span>
            </button>
            <button
              class="btn bg-[#360490] text-white border-none rounded-full"
            >
              Score
              <img src="images/monetization_on.svg" alt="" />
              <span>1</span>
            </button>
          </div>
        </div>
      </section>
      <section class="score"></section>
    </main>
  </body>
</html>
